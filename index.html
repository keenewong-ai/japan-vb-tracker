<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>日本排球賽事追蹤</title>
  <meta name="description" content="日本男排／女排相關球員賽事列表、過往賽果同每場數據" />
  <link rel="stylesheet" href="styles.css?v=20261015e" />
</head>
<body>
  <div class="kb-stage" id="kb-stage" aria-hidden="true">
    <div class="kb-scrim"></div>
  </div>
  <div class="site-shell">
  <div class="topbar">
    <span class="slogan">PASS IT FORWARD</span>
    <span class="topbar-brand">日本排球賽事追蹤</span>
    <span class="topbar-links" id="lastUpdated">載入中…</span>
  </div>

  <nav class="main-nav tabs" role="tablist" aria-label="主要分類">
    <button class="tab active" data-tab="upcoming" role="tab" aria-selected="true">即將開波</button>
    <button class="tab" data-tab="past" role="tab" aria-selected="false">過往賽果</button>
    <button class="tab" data-tab="players" role="tab" aria-selected="false">球員</button>
    <button class="tab" data-tab="gossip" role="tab" aria-selected="false">八卦新聞</button>
    <button class="tab" data-tab="social" role="tab" aria-selected="false">球員動態</button>
  </nav>

  <header class="hero">
    <div class="hero-stripes" aria-hidden="true"></div>
    <div class="hero-inner">
      <div class="hero-text">
        <p class="hero-kicker">JAPAN NATIONAL TEAM · CLUB TRACKER</p>
        <h1>JAPAN<br />VB TRACKER</h1>
        <p class="hero-sub">日本排球賽事追蹤 · 男排 · 女排 · 國家隊同球會</p>
      </div>
      <div class="hero-ball">
        <img src="assets/mikasa-vnl-ball.png?v=20261015e" alt="Mikasa V200W-VNL 公式比賽用球" width="120" height="120" />
      </div>
    </div>
  </header>

  <div class="filters" role="group" aria-label="性別篩選">
    <button class="filter chip active" data-gender="all">全部</button>
    <button class="filter chip" data-gender="men">男排</button>
    <button class="filter chip" data-gender="women">女排</button>
  </div>

  <main>
    <section id="panel-upcoming" class="panel active" role="tabpanel"></section>
    <section id="panel-past" class="panel" role="tabpanel" hidden></section>
    <section id="panel-players" class="panel" role="tabpanel" hidden></section>
    <section id="panel-gossip" class="panel" role="tabpanel" hidden></section>
    <section id="panel-social" class="panel" role="tabpanel" hidden></section>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" data-close aria-label="關閉">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <footer class="site-footer">
    <p>靜態站 · 朝晚搜尋更新 · 冇後端 API</p>
    <p class="footnote">未知數據留空，唔會估分。</p>
  </footer>

  </div><!-- /.site-shell -->
  <script src="app.js?v=20261015e"></script>
</body>
</html>
