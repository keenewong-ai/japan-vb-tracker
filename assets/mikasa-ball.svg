<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Mikasa-style volleyball">
  <defs>
    <clipPath id="ballClip"><circle cx="64" cy="64" r="60"/></clipPath>
    <radialGradient id="ballShine" cx="34%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.22"/>
    </radialGradient>
  </defs>
  <circle cx="64" cy="64" r="60" fill="#F4C41A"/>
  <g clip-path="url(#ballClip)">
    <!-- Classic 3-petal Mikasa swirl: one path, two rotates -->
    <path id="petal" fill="#1B4F9C" d="
      M64 14
      C86 18 104 34 110 54
      C98 58 86 66 78 80
      C72 72 68 68 64 64
      C60 68 56 72 50 80
      C42 66 30 58 18 54
      C24 34 42 18 64 14Z"/>
    <use href="#petal" transform="rotate(120 64 64)"/>
    <use href="#petal" transform="rotate(240 64 64)"/>
  </g>
  <circle cx="64" cy="64" r="60" fill="url(#ballShine)"/>
  <circle cx="64" cy="64" r="60" fill="none" stroke="#082248" stroke-width="3.2"/>
</svg>
