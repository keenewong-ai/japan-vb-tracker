<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>背景動畫 Demo 3 · Ken Burns 慢推鏡 + 滾動淡換</title>
  <style>
    :root { --jva-red: #e60012; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", "PingFang TC", "Noto Sans TC", "Hiragino Sans", sans-serif;
      color: #fff;
      background: #111;
    }
    .stage {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: #000;
    }
    .kb {
      position: absolute;
      inset: 0;
      opacity: 0;
      will-change: opacity, transform;
    }
    .kb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform-origin: center center;
      will-change: transform;
    }
    .scrim {
      position: absolute;
      inset: 0;
      z-index: 5;
      background:
        radial-gradient(ellipse at center, rgba(0,0,0,.25) 0%, rgba(0,0,0,.62) 70%, rgba(0,0,0,.78) 100%),
        linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.55));
      pointer-events: none;
    }
    .ui {
      position: relative;
      z-index: 2;
      min-height: 380vh;
    }
    .hero {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .badge {
      font-size: .7rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: #ffb3b8;
      margin-bottom: 12px;
    }
    h1 {
      font-size: clamp(1.6rem, 6vw, 2.8rem);
      font-weight: 900;
      letter-spacing: .06em;
      text-shadow: 0 4px 28px rgba(0,0,0,.7);
    }
    h1 span { color: var(--jva-red); }
    .sub {
      margin-top: 14px;
      max-width: 380px;
      color: rgba(255,255,255,.8);
      font-size: .9rem;
      line-height: 1.55;
    }
    .hint {
      margin-top: 20px;
      font-size: .82rem;
      color: rgba(255,255,255,.65);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: .55; }
      50% { opacity: 1; }
    }
    .spacer { height: 70vh; }
    .note {
      max-width: 440px;
      margin: 0 auto 40vh;
      padding: 18px 16px;
      background: rgba(0,0,0,.55);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px;
      font-size: .85rem;
      color: #ccc;
      line-height: 1.55;
      backdrop-filter: blur(6px);
    }
    .note strong { color: #fff; }
    .meter {
      position: fixed;
      left: 16px;
      bottom: 56px;
      z-index: 10;
      width: 120px;
    }
    .meter label {
      display: block;
      font-size: .65rem;
      letter-spacing: .08em;
      color: #aaa;
      margin-bottom: 6px;
    }
    .meter .track {
      height: 4px;
      background: rgba(255,255,255,.2);
      border-radius: 2px;
      overflow: hidden;
    }
    .meter .fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--jva-red), #ff6b6b);
    }
    .back {
      position: fixed;
      left: 14px; bottom: 14px;
      z-index: 10;
      color: #ccc;
      font-size: .8rem;
      text-decoration: none;
      background: rgba(0,0,0,.55);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.12);
    }
    .film {
      position: fixed;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .film img {
      width: 42px;
      height: 28px;
      object-fit: cover;
      border-radius: 4px;
      opacity: .4;
      border: 2px solid transparent;
      transition: opacity .2s, border-color .2s;
    }
    .film img.on {
      opacity: 1;
      border-color: var(--jva-red);
    }
  </style>
</head>
<body>
  <div class="stage" id="stage" aria-hidden="true">
    <div class="scrim"></div>
  </div>
  <div class="film" id="film"></div>
  <div class="meter">
    <label>SCROLL · KEN BURNS</label>
    <div class="track"><div class="fill" id="fill"></div></div>
  </div>
  <a class="back" href="index.html">← 返預覽入口</a>

  <main class="ui">
    <div class="hero">
      <p class="badge">Demo 3 · Ken Burns + scroll-scrub</p>
      <h1>日本排球<span>賽事追蹤</span></h1>
      <p class="sub">每張相會自己慢慢推鏡／放大（Ken Burns），同時用滾動進度控制相與相之間嘅透明度交接。</p>
      <p class="hint">↓ 慢慢碌落去感受推鏡</p>
    </div>
    <div class="spacer"></div>
    <p class="note"><strong>感覺重點：</strong>相唔係「跳換」，而係鏡頭繼續喺場地度 sweep，然後自然溶入下一張。電影預告片嗰種慢鏡感。</p>
    <div class="spacer"></div>
    <p class="note">如果你鍾意「靜靜哋靚、唔搶戲」嘅背景，呢版通常最啱做主站常駐效果。</p>
    <div class="spacer"></div>
  </main>

  <script>
    const IMAGES = [
      "../assets/bg/team1.jpg",
      "../assets/bg/team2.jpg",
      "../assets/bg/team3.jpg",
      "../assets/bg/team4.jpg"
    ];
    // Each slide: different pan/zoom direction (Ken Burns recipes)
    const KB = [
      { from: "scale(1.0) translate(0%, 0%)",   to: "scale(1.18) translate(-4%, -3%)" },
      { from: "scale(1.15) translate(3%, 2%)",  to: "scale(1.0) translate(-2%, 0%)" },
      { from: "scale(1.05) translate(-3%, 2%)", to: "scale(1.2) translate(3%, -2%)" },
      { from: "scale(1.12) translate(2%, -2%)", to: "scale(1.0) translate(-3%, 3%)" }
    ];

    const stage = document.getElementById("stage");
    const scrim = stage.querySelector(".scrim");
    const layers = IMAGES.map((src, i) => {
      const wrap = document.createElement("div");
      wrap.className = "kb";
      const img = document.createElement("img");
      img.src = src;
      img.alt = "";
      wrap.appendChild(img);
      stage.insertBefore(wrap, scrim);
      return { wrap, img, kb: KB[i] };
    });

    const film = document.getElementById("film");
    IMAGES.forEach((src, i) => {
      const t = document.createElement("img");
      t.src = src;
      t.alt = "";
      if (i === 0) t.classList.add("on");
      film.appendChild(t);
    });
    const thumbs = [...film.children];
    const fill = document.getElementById("fill");

    function lerp(a, b, t) { return a + (b - a) * t; }
    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

    // Parse simple "scale(s) translate(x%, y%)" — we apply progress within each segment via CSS variables
    function applyKB(layer, localT) {
      // localT 0..1 within this photo's lifetime
      const t = clamp(localT, 0, 1);
      // interpolate scale and translate manually
      const recipes = [
        { s0:1.00, x0:0, y0:0, s1:1.18, x1:-4, y1:-3 },
        { s0:1.15, x0:3, y0:2, s1:1.00, x1:-2, y1:0 },
        { s0:1.05, x0:-3, y0:2, s1:1.20, x1:3, y1:-2 },
        { s0:1.12, x0:2, y0:-2, s1:1.00, x1:-3, y1:3 }
      ];
      const r = recipes[layers.indexOf(layer)];
      const s = lerp(r.s0, r.s1, t);
      const x = lerp(r.x0, r.x1, t);
      const y = lerp(r.y0, r.y1, t);
      layer.img.style.transform = `scale(${s.toFixed(4)}) translate(${x.toFixed(2)}%, ${y.toFixed(2)}%)`;
    }

    function onScroll() {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      const p = max > 0 ? window.scrollY / max : 0;
      fill.style.width = (p * 100).toFixed(2) + "%";

      const n = layers.length;
      // Each photo owns a segment; fade overlap ~20% of segment
      const raw = p * n;
      const i = clamp(Math.floor(raw), 0, n - 1);
      const frac = raw - Math.floor(raw);

      layers.forEach((layer, idx) => {
        let op = 0;
        if (idx === i) {
          // fade out in last 25% of segment
          op = frac < 0.75 ? 1 : 1 - (frac - 0.75) / 0.25;
        } else if (idx === i + 1) {
          // fade in during last 25% of previous
          op = frac < 0.75 ? 0 : (frac - 0.75) / 0.25;
        } else if (idx === n - 1 && p >= 0.999) {
          op = 1;
        }
        // local ken burns progress = overall progress mapped to this slide
        const local = clamp(raw - idx, 0, 1);
        layer.wrap.style.opacity = String(clamp(op, 0, 1));
        applyKB(layer, local);
      });

      const active = clamp(Math.round(raw - 0.01), 0, n - 1);
      thumbs.forEach((t, idx) => t.classList.toggle("on", idx === active));
    }
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll);
    onScroll();
  </script>
</body>
</html>
